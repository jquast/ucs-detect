# docker-compose.yml for ucs-detect terminal testing
#
# Interactive shell:
#   docker compose run --rm shell
#
# Run series (all terminals):
#   docker compose run --rm run-series
#
# Run series with profiling:
#   docker compose run --rm run-series-profile
#
# Run a single terminal:
#   docker compose run --rm -e EXTRA_ARGS="--run-only=xterm" run-series

services:
  shell:
    build:
      context: .
      dockerfile: Dockerfile
    image: ucs-detect:latest
    tty: true
    stdin_open: true
    volumes:
      - .:/app
    environment:
      - DISPLAY=:99
    command: /bin/bash

  run-series:
    build:
      context: .
      dockerfile: Dockerfile
    image: ucs-detect:latest
    volumes:
      - .:/app
    environment:
      - DISPLAY=:99
    command: >
      python run-series.py
      ${EXTRA_ARGS:-}

  run-series-profile:
    build:
      context: .
      dockerfile: Dockerfile
    image: ucs-detect:latest
    volumes:
      - .:/app
    environment:
      - DISPLAY=:99
    command: >
      python run-series.py
      --profile
      ${EXTRA_ARGS:-}
