name: terminal tests

on:
  push:
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - run-series.py
      - re-run.py
      - terminals.yaml
      - ucs_detect/**
      - .github/workflows/terminal-tests.yml
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: build and push docker image
        run: |
          docker buildx build --push \
            --cache-from type=local,src=.buildx-cache \
            --cache-to type=local,dest=.buildx-cache,mode=max \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .
      - name: dry-run terminal discovery
        run: >
          docker run --rm
          -v $PWD:/app
          -e DISPLAY=:99
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          python run-series.py --dry-run --parallel 1

  matrix-list:
    runs-on: ubuntu-latest
    outputs:
      terminals: ${{ steps.gen.outputs.terminals }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: install pyyaml
        run: pip install pyyaml
      - id: gen
        name: generate terminal matrix
        run: |
          TERMINALS=$(python -c "
          import yaml, json
          with open('terminals.yaml') as f:
              t = yaml.safe_load(f)['terminals']
          names = [
              k for k, v in t.items()
              if not (v.get('launch') or {}).get('skip')
              and not v.get('skip_docker')
          ]
          print(json.dumps(names))
          ")
          echo "terminals=$TERMINALS" >> $GITHUB_OUTPUT

  run-series:
    needs: [build-docker, matrix-list]
    strategy:
      fail-fast: false
      matrix:
        terminal: ${{ fromJSON(needs.matrix-list.outputs.terminals) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: pull docker image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      - name: test ${{ matrix.terminal }}
        run: >
          docker run --rm
          -v $PWD:/app
          -e DISPLAY=:99
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          python run-series.py --run-only="${{ matrix.terminal }}" --parallel 1 -t 300
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.terminal }}
          path: data/
          retention-days: 30

  commit-results:
    needs: [run-series]
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: pull docker image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ucs-detect:latest
      - name: download all results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: data/
          merge-multiple: true
      - name: generate screenshots
        run: |
          pip install pyyaml
          python make-screenshots.py --use-docker
      - name: commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/_static/screenshots/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "ci: update test data and screenshots"
          git push
