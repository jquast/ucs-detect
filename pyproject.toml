[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "ucs-detect"
version = "2.3.6"
description = "Detects Unicode support of an interactive terminal"
readme = "README.rst"
keywords = [
  "cjk",
  "combining",
  "console",
  "eastasian",
  "emoji",
  "emulator",
  "terminal",
  "udhr",
  "unicode",
  "vs15",
  "vs16",
  "wcswidth",
  "wcwidth",
  "xterm",
  "zwj",
]
license = "MIT"
license-files = [ "LICENSE" ]
authors = [
  { name = "Jeff Quast", email = "contact@jeffquast.com" },
]
requires-python = ">=3.8"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Internationalization",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Localization",
  "Topic :: Terminals",
  "Topic :: Text Processing :: General",
]
dependencies = [
  "blessed>=1.49,<2",
  "prettytable",
  "pyyaml<7",
  "requests",
  "wcwidth>=0.8.1",
]

[project.optional-dependencies]
# Resource profiling only, used by run-series.py and scripts/make_results_rst.py and
# not by ucs-detect itself.  psutil refuses to build on Cygwin, "platform cygwin is not
# supported", which is a platform ucs-detect is otherwise able to measure.
profile = ["psutil"]

[project.scripts]
ucs-detect = "ucs_detect:main"
ucs-browser = "ucs_detect.browser:main"

[project.urls]
Homepage = "https://github.com/jquast/ucs-detect"

# XXX required when integrating with pre-release of wcwidth as a 'dependency'
#[tool.hatch.metadata]
#allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = [
  "/ucs_detect/**",
  "/data/**",
  "/docs/**",
  "/docs/_static/screenshots/**/*.png",
  "/scripts/**",
  "/.github/**",
  "/README.rst",
  "/LICENSE",
  "/tox.ini",
  "/setup.cfg",
  "/.gitignore",
  "/.pylintrc",
  "/.dockerignore",
  "/.readthedocs.yaml",
  "/Dockerfile",
  "/docker-entrypoint.sh",
  "/terminals.yaml",
  "/requirements-tests.in",
  "/list-terminals.py",
  "/make-screenshots.py",
  "/re-run.py",
  "/run-series.py",
]
