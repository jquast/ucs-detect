terminals:
  AbsoluteTelnet/SSH:
    homepage: https://www.celestialsoftware.net
    skip_system: true
    skip_docker: true
    skip_reason: Windows only
  alacritty:
    homepage: https://alacritty.org/
    launch:
      program: alacritty
      args: [-o, 'font.normal.family="Unifont"', -o, font.size=16,
             -o, window.dimensions.columns=80, -o, window.dimensions.lines=24, -e]
      env:
        WAYLAND_DISPLAY: ''
  bobcat:
    homepage: https://github.com/ismail-yilmaz/Bobcat
    # bobcat reorders injected keystrokes, so the script is the command after `--`
    launch:
      program: bobcat
      args: [--font-family, Unifont, --font-size, '16', --geometry, 140x50, '--']
      env:
        TERM: xterm-256color
    launch_docker:
      program: bobcat
      args: [--font-family, Unifont, --font-size, '16', --geometry, 240x65, '--']
      env:
        TERM: xterm-256color
  contour:
    homepage: https://contour-terminal.org/
    skip_docker: true
    skip_reason: does not respond to CPR (DSR) in Docker/Xvfb; works on host
    launch:
      program: contour
      args: [terminal]
      env:
        FONTCONFIG_FILE: ''
      kill_command:
      - pkill
      - contour
  cool-retro-term:
    homepage: https://github.com/Swordfish90/cool-retro-term
    display_name: cool-retro-term
    version_template: '{aur_version}'
    aur_package: cool-retro-term
    skip_screenshots: true
    skip_spillover: true
    skip_reason: CRT warp and screen effects distort cell blocks calculations
    skip_screenshots_reason: CRT warp and screen noise distort the captured text
    launch:
      program: cool-retro-term
      args: [--fullscreen, -e]
  domterm:
    homepage: https://domterm.org/
    launch:
      program: DomTerm.AppImage
      args: [-e]
    skip_docker: true
    skip_reason: Massive dependencies require several hours to build in docker!
  extraterm:
    homepage: https://extraterm.org/
    skip_docker: true
    skip_reason: JS/Electron-like, no visible window in Xvfb
    profile_processes:
    - qode
    launch:
      program: /opt/extratermqt/extratermqt
      wm_class: qode
      window_search_timeout_ms: 20000
      post_launch_delay_ms: 3000
      post_launch_keys:
      - \kctrl+shift+t
      - \p1000
      - 'sh '
      - ${SCRIPT} && exit
      - "\n"
      kill_command: [sh, -c, 'pkill -x qode; pkill -x extratermqt']
    launch_docker:
      program: extraterm
      args: []
      post_launch_delay_ms: 3000
      post_launch_keys:
      - \kctrl+shift+t
      - \p1000
      - 'sh '
      - ${SCRIPT} && exit
      - "\n"
  foot:
    homepage: https://codeberg.org/dnkl/foot
    launch:
      program: foot
      args: [-f, 'Unifont:size=16', -W, 130x40,
             -o, 'mouse.hide-when-typing=yes']
      wrapper:
      - cage
      - --
    launch_docker:
      program: foot
      # 130x40 of 11x21 cells fills the 1520x920 compositor set in docker-entrypoint.sh, so the two
      # numbers change together.  A grid larger than the output is not clamped: foot reports the
      # requested size and paints into a window that cannot hold it.  Size 16 still halves the
      # page, from 3 grapheme columns by 23 rows at size 24 to 5 by 39.
      args: [-f, 'Unifont:size=16', -W, 130x40,
             -o, 'mouse.hide-when-typing=yes']
    # foot draws its own pointer and Weston composites it at the rest position, the centre of the
    # window, where no X11 pointer move can reach it.  The pages leave the centre three rows
    # unpainted and the published crops splice those rows out, so the pointer never reaches a
    # screenshot.
    cursor_center_rows: 3
    skip_system: true
    skip_reason: Wayland-only (requires cage)
    has_features:
      - ambiguous_wide
  ghostty:
    homepage: https://ghostty.org/
    skip_docker: true
    skip_reason: GPU-accelerated, Docker software rendering presents uniform frames
    launch:
      program: ghostty
      args: [--gtk-single-instance=false, --font-family=Unifont, --font-size=16, -e]
  gnome terminal:
    homepage: https://help.gnome.org/users/gnome-terminal/stable/
    display_name: GNOME Terminal
    version_manual: 3.50.1
    skip_docker: true
    skip_reason: D-Bus architecture (gnome-terminal-server) fails in Docker/Xvfb
    launch:
      program: gnome-terminal
      args: [--wait, --]
    profile_processes:
    - gnome-terminal-server
    timeout: 14400
  hyper:
    homepage: https://hyper.is/
    skip_docker: true
    skip_reason: Electron app creates no visible X11 windows in Xvfb/openbox
    launch:
      program: hyper
      args: []
      post_launch_delay_ms: 3000
      post_launch_keys:
      - 'sh '
      - ${SCRIPT}
      - "\n"
      kill_command: [pkill, hyper]
  iterm2:
    homepage: https://iterm2.com/
    skip_docker: true
    skip_reason: macOS only
    screenshot_delay_ms: 1000
    profile_processes:
    - iTerm2
    launch:
      program: /Applications/iTerm.app/Contents/MacOS/iTerm2
      args: ['{script}']
      macos:
        app: /Applications/iTerm.app
        owner: iTerm2
        adapter: iterm2
      kill_command:
      - pkill
      - -f
      - iTerm.app/Contents/MacOS/iTerm2
    timeout: 14400
  kitty:
    homepage: https://sw.kovidgoyal.net/kitty/
    # kitty takes the widest advance in U+0020..U+007F as its cell width, and Unifont's U+007F
    # glyph is a full em wide, which doubles every cell to 16x16 at font_size=12.  Halve it.
    launch:
      program: kitty
      args: [-o, font_family=Unifont, -o, font_size=12,
             -o, 'modify_font cell_width 50%',
             -o, initial_window_width=80c, -o, initial_window_height=24c,
             sh, '{script}']
    # Run as an X11 client: inside the Weston compositor the window is clipped to the compositor
    # output, which puts the screenshot's bottom crop marker outside the visible page.
    launch_docker:
      program: kitty
      args: [-o, font_family=Unifont, -o, font_size=12,
             -o, 'modify_font cell_width 50%',
             -o, initial_window_width=80c, -o, initial_window_height=24c,
             sh, '{script}']
      env:
        WAYLAND_DISPLAY: ''
  konsole:
    homepage: https://apps.kde.org/konsole/
    skip_docker: true
    skip_reason: creates 1x1 cell windows in Docker
    launch:
      program: konsole
      args: [-p, 'font=Unifont,16', -p, BidiRenderingEnabled=true,
             -p, BidiLineLTR=false, -e]
      wm_class: konsole
    launch_docker:
      program: konsole
      args: [-p, 'font=Unifont,16', -p, BidiRenderingEnabled=true,
             -p, BidiLineLTR=false, -e]
  libvterm:
    homepage: https://www.leonerd.org.uk/code/libvterm/
    description: libvterm tested is the one shipped with vIM when using command, ``:terminal``.
    multiplexer: true
    launch:
      subterminal: true
      program: vim
      args: [-c, ':terminal ++curwin']
      post_launch_delay_ms: 3000
      post_launch_keys:
      - 'sh ${SCRIPT} && exit

        '
    skip_screenshots: true
    skip_spillover: true
    skip_docker: true
    skip_reason: subterminal tested on host via system_screenshots
    skip_screenshots_reason: multiplexer forwards bytes to the host terminal, it does not render text
    skip_spillover_reason: multiplexer forwards bytes to the host terminal, it does not render text
  linux fbdev:
    homepage: https://www.kernel.org/doc/Documentation/fb/fbcon.txt
    launch:
      subterminal: true
    skip_system: true
    skip_docker: true
    skip_reason: requires bare Linux framebuffer console
  lxterminal:
    homepage: https://github.com/lxde/lxterminal
    display_name: LXTerminal
    version_template: '{aur_version}'
    aur_package: lxterminal
    launch:
      program: lxterminal
      args: [--geometry=80x24, -e]
    profile_processes:
    - gnome-terminal-server
    timeout: 14400
  mintty:
    homepage: https://mintty.github.io/
    skip_docker: true
    skip_reason: Windows only
    test_environment_notes: 'These results were recorded by a customized installation:
      a Cygwin-native ``python3`` under Cygwin, with GNU Unifont installed and configured for glyph
      coverage.  A native Windows Python is answered by ConPTY instead of by mintty, see
      `Input/Output interaction with alien programs
      <https://github.com/mintty/mintty/wiki/Tips#inputoutput-interaction-with-alien-programs>`_.
      Even so, font rendering remains corrupted in our test environment, tofu results are incorrect,
      and mintty appears to be entirely without grapheme support.'
  mlterm:
    homepage: https://mlterm.sourceforge.net/
    launch:
      program: mlterm
      args: [--sb=false, -w, '16', --bimode=normal, -e]
    skip_docker: true
    skip_reason: Legacy dependencies require several hours to build
  otty:
    homepage: https://github.com/otty-shell/otty
    version_manual: 0.2.0-alpha.1
    skip_docker: true
    skip_reason: built from source on host; GPU-accelerated (iced/wgpu)
    launch:
      program: /home/jq/Code/otty/target/release/otty
      args: []
      wm_class: run.otty.Otty
      click_before_keys: true
      post_launch_delay_ms: 3000
      post_launch_keys:
      - \kctrl+shift+f
      - \p500
      - 'sh '
      - ${SCRIPT} && exit
      - "\n"
      kill_command:
      - pkill
      - otty
  putty:
    homepage: https://www.chiark.greenend.org.uk/~sgtatham/putty/
    display_name: PuTTY
    version_template: '{aur_version}'
    aur_package: putty
    # pterm lays right to left text out itself, so its spillover scan would report the reordered
    # ink as spill; the scan skips every candidate with a right to left character.
    spillover_rtl: no
    launch:
      program: pterm
      args: [-fn, 'Unifont 16', -geometry, 80x24, -e]
    # GTK3 falls back to Wayland whenever the compositor socket exists, and that window cannot be
    # resized into a larger page; GDK_BACKEND gives pterm a plain X11 window.
    launch_docker:
      program: pterm
      args: [-fn, 'Unifont 16', -geometry, 80x24, -e]
      env:
        GDK_BACKEND: x11
  qterminal:
    homepage: https://github.com/lxqt/qterminal
    display_name: QTerminal
    version_template: '{aur_version}'
    aur_package: qterminal
    launch:
      program: qterminal
      args: [--geometry, 960x540, -e]
    skip_docker: true
    skip_reason: Qt terminal hangs in Docker
  rio:
    homepage: https://rioterm.com/
    skip_docker: true
    skip_reason: exits 1 with software Vulkan (lavapipe); works on host with GPU
    # Rio has one font family and no emoji presentation rules, so Unifont's own mono emoji glyphs
    # win over Noto Color Emoji. .terminal-config/rio/config.toml maps the astral emoji planes to
    # the emoji font; RIO_CONFIG_HOME is used verbatim, without a "rio" suffix.
    launch:
      program: rio
      args: [-e]
      env:
        RIO_CONFIG_HOME: '{project_dir}/.terminal-config/rio'
  rxvt-unicode:
    homepage: http://software.schmorp.de/pkg/rxvt-unicode.html
    version_template: '{aur_version}'
    aur_package: rxvt-unicode
    launch:
      program: urxvt
      args: [+sb, -fn, 'xft:Unifont:pixelsize=16,xft:Unifont Upper:pixelsize=16',
             -rv, -e]
      kill_command:
      - pkill
      - urxvt
  screen:
    homepage: https://www.gnu.org/software/screen/
    display_name: GNU Screen
    multiplexer: true
    version_template: '{aur_version}'
    aur_package: screen
    skip_docker: true
    skip_screenshots: true
    skip_spillover: true
    skip_reason: subterminal tested on host via system_screenshots
    skip_screenshots_reason: multiplexer forwards bytes to the host terminal, it does not render text
    skip_spillover_reason: multiplexer forwards bytes to the host terminal, it does not render text
    launch:
      subterminal: true
      program: screen
      args: [-q]
      post_launch_delay_ms: 3000
      post_launch_keys:
      - "\n"
      - \p1000
      - screen -X truecolor on
      - "\n"
      - \p300
      - 'sh '
      - ${SCRIPT} && exit
      - "\n"
  securecrt:
    homepage: https://www.vandyke.com/products/securecrt/
    launch:
      skip: true
    skip_reason: My evaluation license has expired
  st:
    homepage: https://st.suckless.org/
    display_name: st
    version_manual: 0.9.2
    launch:
      program: st
      args: [-f, 'Unifont,Unifont Upper:pixelsize=16', -g, 80x24, -e]
  syncterm:
    homepage: https://syncterm.bbsdev.net/
    launch:
      skip: true
      program: syncterm
      args: [Local]
      post_launch_delay_ms: 3000
      post_launch_keys:
      - 'sh '
      - ${SCRIPT} && exit
      - "\n"
    skip_reason: Not very interesting/too far outliar to join scaled score, like fbdev
  tabby:
    homepage: https://tabby.sh/
    skip_docker: true
    skip_reason: Electron app; not packaged for Arch
    version_manual: 1.0.230
    launch:
      program: tabby
      args: [run, sh, '{script}']
      kill_command:
      - pkill
      - tabby
  tecolot:
    homepage: https://tecolot.com/
    display_name: Tecolot
    version_manual: 0.99.12
    skip_docker: true
    skip_reason: macOS only
    profile_processes:
    - Tecolot
    launch:
      program: /Applications/Tecolot.app/Contents/MacOS/Tecolot
      args: []
      post_launch_delay_ms: 9000
      post_launch_keys:
      - 'sh '
      - ${SCRIPT} && exit
      - "\n"
      macos:
        app: /Applications/Tecolot.app
        owner: Tecolot
        adapter: tecolot
      kill_command:
      - pkill
      - Tecolot
  teraterm:
    homepage: https://teratermproject.github.io/
    launch: null
    skip_system: true
    skip_docker: true
    skip_reason: Windows-only, not available on Linux
  terminal.app:
    homepage: https://support.apple.com/guide/terminal/welcome/mac
    skip_docker: true
    skip_reason: macOS only
    profile_processes:
    - Terminal
    launch:
      program: /System/Applications/Utilities/Terminal.app/Contents/MacOS/Terminal
      args: ['{script}']
      macos:
        app: /System/Applications/Utilities/Terminal.app
        owner: Terminal
        adapter: terminal
      kill_command:
      - pkill
      - -f
      - Terminal.app/Contents/MacOS/Terminal
  terminal.exe:
    homepage: https://learn.microsoft.com/en-us/windows/terminal/
    skip_docker: true
    skip_reason: Windows only
  terminator:
    homepage: https://gnome-terminator.org/
    display_name: Terminator
    version_template: '{aur_version}'
    aur_package: terminator
    version_manual: 2.1.3
    launch:
      program: terminator
      args: [-x, sh, '{script}']
    profile_processes:
    - gnome-terminal-server
    timeout: 14400
    skip_docker: true
    skip_reason: D-Bus spawns gnome-terminal-server, geometry doesn't apply
  terminology:
    homepage: https://www.enlightenment.org/about-terminology
    skip_docker: true
    launch:
      program: terminology
      args: [--geometry, 80x24, --scale, '1.0', --font=Unifont/16, -e]
  termy:
    homepage: https://github.com/lassejlv/termy
    version_manual: 1.0.0-rc.11
    skip_docker: true
    skip_reason: GPU-accelerated (GPUI/Vulkan); needs a real GPU, installed from the upstream deb
    test_environment_notes: 'Reports ``TERM_PROGRAM=ghostty`` and ``TERM_PROGRAM_VERSION=1.2.0``
      to child processes even when both are unset at launch, so environment-based identification
      points at Ghostty.  It identifies itself as ``Termy 0.2.0`` by XTVERSION.'
    launch:
      program: termy
      args: []
      click_before_keys: true
      post_launch_delay_ms: 3000
      post_launch_keys:
      - 'sh '
      - ${SCRIPT} && exit
      - "\n"
  tmux:
    homepage: https://github.com/tmux/tmux
    multiplexer: true
    skip_docker: true
    skip_screenshots: true
    skip_spillover: true
    skip_reason: subterminal tested on host via system_screenshots
    skip_screenshots_reason: multiplexer forwards bytes to the host terminal, it does not render text
    skip_spillover_reason: multiplexer forwards bytes to the host terminal, it does not render text
    sixel_support_notes: 'Must be compiled with sixel support. Check support and enablement
      with command: ``(tmux show-options -g;tmux show-window-options)|grep -i sixel``'
    launch:
      subterminal: true
      program: tmux
      args: [new-session]
      post_launch_delay_ms: 3000
      post_launch_keys:
      - 'sh '
      - ${SCRIPT} && exit
      - "\n"
  xterm.js:
    homepage: https://code.visualstudio.com/docs/terminal/basics
    description: The xterm.js variant tested is the one shipped with Visual Studio
      Code's integrated terminal.
    sixel_support_notes: 'Must be enabled with ``"terminal.integrated.enableImages":
      true``.'
    launch:
      subterminal: true
      skip: true
    skip_system: true
    skip_docker: true
    skip_reason: Run by hand because it is complex and auto-updates itself, maybe it could be in docker
  XTerm.NET:
    homepage: https://github.com/tomlm/XTerm.NET
    description: XTerm.NET is a headless emulator library; tested through the Example desktop
      application of its Avalonia host, Iciclecreek.Avalonia.Terminal.
    skip_system: true
    skip_reason: built from source in the Docker image
    launch:
      program: /opt/xtermnet/Example
      args: []
      click_before_keys: true
      post_launch_delay_ms: 3000
      post_launch_keys:
      - 'sh '
      - ${SCRIPT} && exit
      - "\n"
  weston-terminal:
    homepage: https://gitlab.freedesktop.org/wayland/weston
    version_template: '{aur_version}'
    aur_package: weston
    skip: true
    skip_reason: Wayland window is difficult to control, screenshots of any kind are unreliable
    launch:
      program: weston-terminal
      args: [--shell, '{script}']
      wrapper:
      - cage
      - --
    launch_docker:
      program: weston-terminal
      args: [--shell, '{script}']
  warp:
    homepage: https://github.com/warpdotdev/warp
    display_name: Warp
    version_template: '{aur_version}'
    aur_package: warp-terminal-bin
    skip_docker: true
    skip_reason: GPU-accelerated; software rendering untested (same class as Rio)
    launch:
      program: warp-terminal
      args: []
      wm_class: dev.warp.Warp
      key_delay_ms: 50
      post_launch_delay_ms: 3000
      post_launch_keys:
      - 'sh '
      - ${SCRIPT} && exit
      - "\n"
  wezterm:
    homepage: https://wezfurlong.org/wezterm/
    # Unifont's advance is half an em, WezTerm's default cell is one em, so halve the cell to keep
    # the text grid tight.  WezTerm paints only the viewport it was launched with, so growing the
    # window afterwards leaves the lower half of each page blank: 46 rows covers 1920x1080.
    launch:
      program: wezterm
      args: [--config, 'font=wezterm.font("Unifont")', --config, font_size=16,
             --config, cell_width=0.5, --config, bidi_enabled=true, start, --]
    launch_docker:
      program: wezterm
      args: [--config, 'font=wezterm.font("Unifont")', --config, font_size=16,
             --config, cell_width=0.5, --config, bidi_enabled=true,
             --config, enable_wayland=false,
             --config, initial_cols=89, --config, initial_rows=46, start, --]
      env:
        WAYLAND_DISPLAY: ''
    timeout: 1800
    has_features:
      - ambiguous_wide
  xfce4-terminal:
    homepage: https://docs.xfce.org/apps/terminal/start
    display_name: XFCE Terminal
    version_template: '{aur_version}'
    aur_package: xfce4-terminal
    version_manual: 1.1.3
    launch:
      program: xfce4-terminal
      args: [--font=Unifont 16, -e, 'sh {script}']
    launch_docker:
      program: xfce4-terminal
      args: [--font=Unifont 16, -e, 'sh {script}']
      env:
        WAYLAND_DISPLAY: ''
        GDK_BACKEND: x11
    profile_processes:
    - gnome-terminal-server
    timeout: 14400
  xterm:
    homepage: https://invisible-island.net/xterm/
    sixel_support_notes: Sixel support is enabled by CLI argument, E.g. ``xterm -rv -ti vt340``.
    launch:
      program: xterm
      args: [-fa, 'Unifont,Unifont Upper', -fs, '16', -rv, -ti, vt340, -e]
  zutty:
    homepage: https://tomscii.sig7.se/zutty/
    version_template: '{aur_version}'
    aur_package: zutty
    launch:
      program: zutty
      args: [-fontsize, '16', -e]
  zellij:
    homepage: https://github.com/zellij-org/zellij
    multiplexer: true
    skip_docker: true
    skip_screenshots: true
    skip_spillover: true
    skip_reason: subterminal tested on host via system_screenshots
    skip_screenshots_reason: multiplexer forwards bytes to the host terminal, it does not render text
    skip_spillover_reason: multiplexer forwards bytes to the host terminal, it does not render text
    launch:
      subterminal: true
      program: zellij
      args: []
      post_launch_delay_ms: 3000
      post_launch_keys:
      - 'sh '
      - ${SCRIPT} && pkill zellij
      - "\n"
    launch_docker:
      subterminal: true
      program: zellij
      args: []
      post_launch_delay_ms: 3000
      post_launch_keys:
      - 'sh '
      - ${SCRIPT} && pkill zellij
      - "\n"
    description: Zellij is a terminal workspace and multiplexer.
